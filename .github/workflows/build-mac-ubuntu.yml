name: Build Mori Web desktop installers

run-name: Build Mori Web ${{ inputs.version }} for macOS and Ubuntu

on:
  workflow_dispatch:
    inputs:
      version:
        description: Installer version
        required: true
        default: v0.2.9
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.platform }} installer
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: mac
            platform: macOS
            output: output/installers/mac/Mori-Web-${{ inputs.version }}-mac-universal.dmg
            checksum: output/installers/mac/Mori-Web-${{ inputs.version }}-mac-universal.dmg.sha256
          - os: ubuntu-latest
            target: ubuntu
            platform: Ubuntu
            output: output/installers/ubuntu/Mori-Web-${{ inputs.version }}-linux-amd64.deb
            checksum: output/installers/ubuntu/Mori-Web-${{ inputs.version }}-linux-amd64.deb.sha256

    runs-on: ${{ matrix.os }}
    env:
      MORI_VERSION_INPUT: ${{ inputs.version }}
      MORI_TARGET: ${{ matrix.target }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate version
        shell: bash
        run: |
          set -euo pipefail
          version="${MORI_VERSION_INPUT#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version must look like v0.2.9; got '$MORI_VERSION_INPUT'." >&2
            exit 1
          fi
          echo "MORI_VERSION=$version" >> "$GITHUB_ENV"

      - name: Install build dependencies
        run: npm ci --prefix "packaging/${MORI_TARGET}"

      - name: Build native installer
        shell: bash
        run: bash "packaging/${MORI_TARGET}/package.sh" "$MORI_VERSION"

      - name: Verify package output
        shell: bash
        env:
          PACKAGE_FILE: ${{ matrix.output }}
          CHECKSUM_FILE: ${{ matrix.checksum }}
        run: |
          set -euo pipefail
          if [[ ! -s "$PACKAGE_FILE" || ! -s "$CHECKSUM_FILE" ]]; then
            echo "Expected installer or checksum is missing." >&2
            find output/installers -maxdepth 3 -type f -print 2>/dev/null || true
            exit 1
          fi
          ls -lh "$PACKAGE_FILE" "$CHECKSUM_FILE"

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Mori-Web-${{ inputs.version }}-${{ matrix.target }}
          path: |
            ${{ matrix.output }}
            ${{ matrix.checksum }}
          if-no-files-found: error
          retention-days: 30
