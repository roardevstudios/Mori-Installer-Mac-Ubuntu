name: Package Mori for macOS and Ubuntu

run-name: Package Mori ${{ inputs.version }} for macOS and Ubuntu

on:
  workflow_dispatch:
    inputs:
      version:
        description: Mori version to put in the package filenames
        required: true
        default: v0.2.9
        type: string

permissions:
  contents: read

jobs:
  package:
    name: Package ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macOS
            target: mac
            payload: build/macos/Mori.app
            extension: dmg
          - os: ubuntu-latest
            platform: Ubuntu
            target: ubuntu
            payload: build/linux/AppDir
            extension: deb

    runs-on: ${{ matrix.os }}
    env:
      MORI_VERSION_INPUT: ${{ inputs.version }}
      MORI_TARGET: ${{ matrix.target }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Ubuntu package tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes dpkg-dev

      - name: Validate version and check for native app build source
        shell: bash
        run: |
          set -euo pipefail
          version="${MORI_VERSION_INPUT#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version must look like v0.2.9; got '$MORI_VERSION_INPUT'." >&2
            exit 1
          fi
          echo "MORI_VERSION=$version" >> "$GITHUB_ENV"

          build_script="desktop/${MORI_TARGET}/build-app.sh"
          if [[ ! -f "$build_script" ]]; then
            echo "Cannot build Mori for ${MORI_TARGET}: $build_script is missing." >&2
            echo "Add a native macOS/Linux app build and place its output at '${{ matrix.payload }}'." >&2
            echo "The current desktop app is WPF for Windows; this workflow will not repackage its .exe as a native installer." >&2
            exit 1
          fi

      - name: Build native Mori app
        shell: bash
        run: bash "desktop/${MORI_TARGET}/build-app.sh" "$MORI_VERSION" "${{ matrix.payload }}"

      - name: Package native installer
        shell: bash
        run: bash "packaging/${MORI_TARGET}/package.sh" "$MORI_VERSION" "${{ matrix.payload }}" output/installers

      - name: Upload installer and checksum
        uses: actions/upload-artifact@v4
        with:
          name: Mori-${{ inputs.version }}-${{ matrix.target }}
          path: output/installers/*
          if-no-files-found: error
          retention-days: 30
